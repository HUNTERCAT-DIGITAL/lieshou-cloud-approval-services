# lieshou-cloud · approval-services 质量门禁（GitLab CI · 2026-09）
# 前置：huntercat-digital 组级 docker runner（java-maven @ wqc-server-dell · tags: java,wqc）
# 门 = mvn -B -ntp verify（spotless:check + 单测 + jacoco，由 framework-parent 统一绑定）
#      PG 集成测试：CI 由下面的 postgres service 提供真库（本地开发仍走 Testcontainers——
#      宿主 ufw INPUT DROP 会挡掉 job 容器 → 宿主随机发布端口的回连，走容器网络 alias 才稳）
# 上游：本仓无 submodule —— framework-parent / framework-* 全部从内网 Nexus 解析
stages: [verify, deploy, image]

variables:
  # 依赖缓存由 runner 宿主卷提供（/srv/gitlab-runner-cache/m2 → /root/.m2）
  # —— Harbor（镜像仓）：project lieshou-cloud，robot robot$lieshou-cloud+gitlab-ci ——
  HARBOR_REGISTRY: harbor.ts.huntercat.cn
  HARBOR_IMAGE: harbor.ts.huntercat.cn/lieshou-cloud/approval
  # —— postgres service（镜像/版本与 PostgresTestSupport 的 Testcontainers 一致）——
  POSTGRES_DB: lieshoucloudpro
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lieshoucloudpro
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres

default:
  image: maven:3.9-eclipse-temurin-21
  tags: [java, wqc]

verify:
  stage: verify
  timeout: 30m
  services:
    - name: postgres:16-alpine
      alias: postgres
  before_script:
    # 内部 CA 进 JVM 信任库（job 容器不认 Caddy 自签 CA；CA 由 runner 挂载卷 /root/.m2 提供）
    - test -f /root/.m2/caddy-root.crt && keytool -importcert -noprompt -trustcacerts -alias caddy-root -file /root/.m2/caddy-root.crt -keystore "$JAVA_HOME/lib/security/cacerts" -storepass changeit
    - printf '<settings><mirrors><mirror><id>nexus-public</id><url>https://nexus.ts.huntercat.cn/repository/maven-public/</url><mirrorOf>*</mirrorOf></mirror></mirrors></settings>' > /tmp/read-settings.xml
  script:
    - java -version
    # 读一律走内网 Nexus（mirrorOf=*）—— framework-* 只在这里，Central 上没有
    - mvn -B -ntp -s /tmp/read-settings.xml clean verify
    # 产物层守卫：jar 内 Flyway 迁移版本号必须唯一
    #   为什么查产物不查源码：0.3.5 的坏制品里同时含 V4__seed_default_* 与 V4__seed_haizan_*，
    #   而本仓任何提交都不同时含这两份 → 第二份来自构建目录残留，**只有拆 jar 才看得见**
    - bash scripts/check-migration-versions.sh services/approval/target
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# 制品发布：仅 tag 触发，发到内网 Nexus maven-releases（凭证在项目 CI 变量 NEXUS_DEPLOY_*）
# 坐标 cn.huntercat:lieshoucloud-approval:<version>（版本继承 framework-parent，故 tag 必须 vX.Y.Z 对齐）
# 只发本仓模块：framework-* 由 framework 仓自己发布（同坐标重复发布会撞 Nexus 重发策略）
deploy:
  stage: deploy
  timeout: 30m
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    # servers = 发布凭证；mirror 只服务读（*,!nexus 不劫持 distributionManagement 的 nexus）
    - printf '<settings><servers><server><id>nexus</id><username>%s</username><password>%s</password></server></servers><mirrors><mirror><id>nexus-public</id><url>https://nexus.ts.huntercat.cn/repository/maven-public/</url><mirrorOf>*,!nexus</mirrorOf></mirror></mirrors></settings>' "$NEXUS_DEPLOY_USER" "$NEXUS_DEPLOY_PASS" > /tmp/ci-settings.xml
    # tag 必须与 pom 版本一致，否则拒发（防止 v0.4.0 下发成 0.3.1）
    - |
      set -e
      ver=$(mvn -B -q -s /tmp/ci-settings.xml -pl services/approval help:evaluate -Dexpression=project.version -DforceStdout | tail -1)
      [ "$CI_COMMIT_TAG" = "v$ver" ] || { echo "❌ tag $CI_COMMIT_TAG 与 pom 版本 v$ver 不一致"; exit 1; }
      echo "发布 cn.huntercat:lieshoucloud-approval:$ver → Nexus maven-releases"
    # 内部 CA 进 JVM 信任库（job 容器不认 Caddy 自签 CA；CA 由 runner 挂载卷 /root/.m2 提供）
    - keytool -importcert -noprompt -trustcacerts -alias caddy-root -file /root/.m2/caddy-root.crt -keystore "$JAVA_HOME/lib/security/cacerts" -storepass changeit
    # -pl 只发 approval（依赖 framework-* 从 maven-public/本地库解析）；测试已在 verify 阶段卡过
    # ① 先**干净**构建：不 clean 会把上一次 target/classes 残留一起打进 jar
    #    （0.3.5 制品就是这么坏的：jar 内两份 V4 → Flyway "Found more than one migration with version 4"
    #      → approval 启动即崩、整栈起不来。该版本发布于 2026-09-15，且**没有对应 tag**，
    #      属绕过 CI 的手工 `mvn deploy`；制品只允许经 CI tag 发布）
    - mvn -B -ntp -s /tmp/ci-settings.xml -pl services/approval -DskipTests clean package
    # ② 发布前守卫：查**产物**里迁移版本号是否唯一（重复即拒发）
    - bash scripts/check-migration-versions.sh services/approval/target
    # ③ 守卫通过才发（同源同状态重建，产物等价）
    - mvn -B -ntp -s /tmp/ci-settings.xml -pl services/approval -DskipTests deploy

# 镜像构建 + 推送 Harbor（CD 第一段：可运行制品）
# tag → :<version> 自动；main → :dev 手动（不扰民，也不给每次 push 都烧一个全量镜像构建）
# 前置：runner 已把宿主 /var/run/docker.sock 挂进 job（构建/推送都走宿主 daemon）
build-image:
  stage: image
  timeout: 45m
  # docker:cli 自带 git/ssh（子仓初始化）+ docker CLI，宿主零安装
  image: docker.1ms.run/docker:cli
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  before_script:
    # 注意：这一行**不能**出现 ASCII 的 ": "（YAML 会把未加引号的标量解析成 mapping →
    #        GitLab 报 "before_script config should be a string or a nested array of strings"）
    - echo "上游 framework 走内网 Nexus（本仓无 submodule），build-image 无需初始化 submodule"
  script:
    # ⚠️ robot 用户名里的 $ 不能走 CI 变量：GitLab 把 $lieshou 当未定义变量吃掉（Harbor 日志实测收到 robot-cloud+gitlab-ci）
    #    单引号里是字面量：GitLab 不替换、shell 也不展开
    - echo "$HARBOR_PASS" | docker login "$HARBOR_REGISTRY" -u 'robot$lieshou-cloud+gitlab-ci' --password-stdin
    - |
      set -e
      if [ -n "$CI_COMMIT_TAG" ]; then TAG="${CI_COMMIT_TAG#v}"; else TAG="dev"; fi
      echo "构建 $HARBOR_IMAGE:$TAG（context = 仓库根，services/approval/Dockerfile）"
      docker build -f services/approval/Dockerfile -t "$HARBOR_IMAGE:$TAG" .
      docker push "$HARBOR_IMAGE:$TAG"
      echo "✅ 已推送 $HARBOR_IMAGE:$TAG"
